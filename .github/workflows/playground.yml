# Each push to main builds manyan for WebAssembly, runs the conformance suite
# with it, and serves the playground (playground/) from the gh-pages branch.
name: playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:7.0.0
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-javascript
      - run: make playground
      - working-directory: .obj/playground
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Playground at $GITHUB_SHA"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" gh-pages
