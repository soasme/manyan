<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<link rel="icon" href="{root}logo.jpg">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b675f; --line: #dedad2; --code: #f1eee7;
    --panel: #ffffff; --accent: #9c3b25; --accent-fg: #ffffff; --bad: #a3271a; --good: #2f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --fg: #e9e6df; --muted: #9a958b; --line: #34312c; --code: #23211e;
      --panel: #1e1d1a; --accent: #e07a5f; --accent-fg: #161513; --bad: #f08a7a; --good: #8fca8f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .top { border-bottom: 1px solid var(--line); }
  .top nav { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 4px 18px; flex-wrap: wrap; }
  .top a { color: var(--muted); text-decoration: none; }
  .top a:hover, .top a[aria-current] { color: var(--fg); }
  .top a:first-child { color: var(--fg); font-weight: 600; margin-right: auto; }
  article { max-width: 820px; margin: 0 auto; padding: 8px 16px 48px; }
  a { color: var(--accent); }
  h1 { font-size: 30px; line-height: 1.2; margin: 28px 0 12px; }
  h2 { font-size: 22px; margin: 36px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 18px; margin: 28px 0 6px; }
  code, pre { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code { background: var(--code); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; }
  th, td { border: 1px solid var(--line); padding: 4px 10px; vertical-align: top; }
  th { background: var(--code); }
  img { max-width: 100%; }
</style>
</head>
<body>
<header class="top"><nav>{nav}</nav></header>
<article>
{body}
</article>
</body>
</html>
